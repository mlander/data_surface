# Prism, from a CDN, the version pinned and each file held to its
# Subresource Integrity hash, which cdnjs publishes: the core and only the
# languages the module's code blocks are in (markup and markup-templating
# are what php and twig need). No autoloader: a language not listed here
# is not fetched.
# Decision: see docs/decisions.md#contract-3-the-operation-is-the-method.

