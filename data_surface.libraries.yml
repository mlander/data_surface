# Loaded before Prism's core, which reads Prism.manual as it loads, so
# Prism highlights only when highlight.js asks.
prism_manual:
  js:
    js/prism-manual.js: {}

# What the data_surface_code element attaches: highlights each block once,
# over AJAX too.
highlight:
  js:
    js/highlight.js: {}
  dependencies:
    - core/drupal
    - core/once
    - data_surface/prism
