$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Mixed
status: stable
description: 'Props no stock widget draws: one typed as several JSON types, a list of lists and a list of anything.'
props:
