$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Nest
status: stable
description: 'A box whose slots expect boxes: one by its tag, as deep as slots go, and one by its id, one at most.'
tags:
  - nest
props:
  type: object
  properties:
    label:
      type: ['string', 'null']
      title: Label
slots:
  inner:
    title: Inner
    expected:
      - nest
  single:
    title: Single
    expected:
      - 'surface_component_test:nest'
    maxItems: 1
