# The digest fixture: a schedule whose shape is the chosen frequency's,
# two of them empty.
# Generated from the resource_test.digest resource by drush data_surface:config-schema.
data_surface_resource_test.digest:
  type: config_object
  label: 'Digest'
  constraints:
    FullyValidatable: ~
  mapping:
    frequency:
      type: string
      label: 'Frequency'
    schedule:
      type: 'data_surface_resource_test.digest.schedule.[%parent.frequency]'
      label: 'Schedule'

# Generated from the resource_test.digest resource by drush data_surface:config-schema.
data_surface_resource_test.digest.schedule.daily:
  type: mapping
  label: 'Daily'
  constraints:
    FullyValidatable: ~
  mapping: {  }

# Generated from the resource_test.digest resource by drush data_surface:config-schema.
data_surface_resource_test.digest.schedule.monthly:
  type: mapping
  label: 'Monthly'
  constraints:
    FullyValidatable: ~
  mapping: {  }

# Generated from the resource_test.digest resource by drush data_surface:config-schema.
data_surface_resource_test.digest.schedule.weekly:
  type: mapping
  label: 'Weekly'
  constraints:
    FullyValidatable: ~
  mapping:
    send_day:
      type: string
      label: 'Send day'

# The bulletin fixture: a send day that applies only to a weekly bulletin.
# Generated from the resource_test.bulletin resource by drush data_surface:config-schema.
data_surface_resource_test.bulletin:
  type: config_object
  label: 'Bulletin'
  constraints:
    FullyValidatable: ~
  mapping:
    frequency:
      type: string
      label: 'Frequency'
    send_day:
      type: string
      label: 'Send day'

# The parcel fixture: every rule between its keys declared as data.
# Generated from the resource_test.parcel resource by drush data_surface:config-schema.
data_surface_resource_test.parcel:
  type: config_object
  label: 'Parcel'
  constraints:
    FullyValidatable: ~
  mapping:
    service:
      type: string
      label: 'Service'
    weight:
      type: integer
      label: 'Weight in kilograms'
      constraints:
        Range:
          min: 1
          max: 1000
    insured:
      type: boolean
      label: 'Insured'
      nullable: true
    declared_value:
      type: integer
      label: 'Declared value'
      nullable: true
      constraints:
        Range:
          min: 0
          max: 100000
    reference:
      type: string
      label: 'Reference'
      nullable: true
      constraints:
        Length:
          max: 32
    signature:
      type: string
      label: 'Signed for by'
      nullable: true
      constraints:
        Length:
          max: 64
    tracking:
      type: string
      label: 'Tracking code'
      nullable: true
    handling:
      type: string
      label: 'Handling'
      nullable: true
    labels:
      type: sequence
      label: 'Labels'
      nullable: true
      constraints:
        Count:
          max: 3
      sequence:
        type: string
        label: 'Labels'
    note:
      type: string
      label: 'Note for the driver'
      nullable: true
    third_party_settings:
      type: sequence
      label: 'Third party settings'
      requiredKey: false
      sequence:
        type: 'data_surface_resource_test.parcel.third_party.[%key]'

# What ParcelAlter mounts on the parcel, under the module's name.
# Generated from the resource_test.parcel resource by drush data_surface:config-schema.
data_surface_resource_test.parcel.third_party.data_surface_resource_test:
  type: mapping
  label: 'Data Surface Resource Test'
  constraints:
    FullyValidatable: ~
  mapping:
    customs:
      type: string
      label: 'Customs code'
      nullable: true
      requiredKey: false

