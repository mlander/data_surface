                Range:
                  min: 0

# The ledger fixture: the timestamps structure attached under a key.
# Generated from the resource_test.ledger resource by drush data_surface:config-schema.
data_surface_resource_test.ledger:
  type: config_object
  label: 'Ledger'
  constraints:
    FullyValidatable: ~
  mapping:
    name:
      type: string
      label: 'Name'
    stamps:
      type: mapping
      label: 'Stamps'
      mapping:
        created:
          type: integer
          label: 'Created'
          nullable: true
          constraints:
            Range:
              min: 0
        changed:
          type: integer
          label: 'Changed'
          nullable: true
          constraints:
            Range:
              min: 0

# The depot fixture: the stock code shape at two keys, and a shelf tag
# reading it through a port.
# Generated from the resource_test.depot resource by drush data_surface:config-schema.
data_surface_resource_test.depot:
  type: config_object
  label: 'Depot'
  constraints:
    FullyValidatable: ~
  mapping:
    sku:
      type: string
      label: 'Stock code'
      constraints:
        Regex:
          pattern: '/^[A-Z]{2}\d+$/D'
        Length:
          min: 4
          max: 12
    spare:
      type: string
      label: 'Spare code'
      nullable: true
      constraints:
        Regex:
          pattern: '/^[A-Z]{2}\d+$/D'
        Length:
          max: 6
    tag:
      type: mapping
      label: 'Shelf tag'
      mapping:
        label:
          type: string
          label: 'Label'
          nullable: true
          constraints:
            Length:
              max: 20

# The exhibit fixture: the provenance mixed in, its members listed flat
# beside the title; the loan attached, with its insurance inside it.
# Generated from the resource_test.exhibit resource by drush data_surface:config-schema.
data_surface_resource_test.exhibit:
  type: config_object
  label: 'Exhibit'
  constraints:
    FullyValidatable: ~
  mapping:
    title:
      type: string
      label: 'Title'
    status:
      type: string
      label: 'Status'
    room:
      type: string
      label: 'Room'
      nullable: true
    source:
      type: string
      label: 'Source'
      nullable: true
    acquired:
      type: integer
      label: 'Acquired'
      nullable: true
      constraints:
        Range:
          min: 1800
    loan:
      type: mapping
      label: 'Loan'
      mapping:
        lender:
          type: string
          label: 'Lender'
          nullable: true
        until:
          type: integer
          label: 'Until'
          nullable: true
        insurance:
          type: mapping
          label: 'Insurance'
          mapping:
            policy:
              type: string
              label: 'Policy'
              nullable: true

# The opening hours fixture: the common settings recipes (docs/recipes.md).
# Fully validatable, so a key not marked nullable always holds a value.
# Generated from the resource_test.opening_hours resource by drush data_surface:config-schema.
data_surface_resource_test.opening_hours:
  type: config_object
  label: 'Opening hours'
  constraints:
    FullyValidatable: ~
  mapping:
    opens:
      type: string
      label: 'Opens at'
      constraints:
        Regex:
          pattern: '/^([01]\d|2[0-3]):[0-5]\d$/D'
    closes:
      type: integer
      label: 'Closes at, in minutes after midnight'
      constraints:
        Range:
          min: 721
          max: 1439
    days:
      type: sequence
      label: 'Days open'
      sequence:
        type: string
        label: 'Days open'
    notes:
      type: string
      label: 'Notes'
      nullable: true
    after_hours:
      type: boolean
      label: 'After-hours access'
    door_code:
      type: string
      label: 'Door code'
      nullable: true
    late_days:
      type: sequence
      label: 'After-hours days'
      sequence:
        type: string
        label: 'After-hours days'
    keywords:
      type: sequence
      label: 'Keywords'
      sequence:
        type: string
        label: 'Keywords'
    holidays:
      type: string
      label: 'On public holidays'

# The benches the site has: the workshop's keys from the site.
data_surface_resource_test.benches:
  type: config_object
  label: 'Benches'
  mapping:
    benches:
      type: sequence
      label: 'Benches'
      sequence:
        type: mapping
        label: 'Bench'
        mapping:
          label:
            type: label
            label: 'Label'
          locked:
            type: boolean
            label: 'Locked'

# The workshop fixture: one bench, one light and one stock code per bench
# the site lists.
# Generated from the resource_test.workshop resource by drush data_surface:config-schema.
data_surface_resource_test.workshop:
  type: config_object
  label: 'Workshop'
  constraints:
    FullyValidatable: ~
  mapping:
    closed:
      type: boolean
      label: 'Closed'
      nullable: true
    benches:
      type: sequence
      label: 'Benches'
      sequence:
        type: mapping
        label: 'Benches'
        mapping:
          enabled:
            type: boolean
            label: 'In use'
            nullable: true
            requiredKey: false
          hours:
            type: integer
            label: 'Hours a day'
            nullable: true
            requiredKey: false
    lights:
      type: sequence
      label: 'Lights'
      sequence:
        type: boolean
        label: 'Lights'
        nullable: true
    codes:
      type: sequence
      label: 'Bench codes'
      sequence:
        type: string
        label: 'Bench codes'
        nullable: true
        constraints:
          Regex:
            pattern: '/^[A-Z]{2}\d+$/D'
          Length:
            max: 12

# The gallery fixture: access answered by alters. The plaque is mixed in,
# its members flat beside the name; a wall attached twice; a finish typed
# by the medium; a room per entry the site lists.
# Generated from the resource_test.gallery resource by drush data_surface:config-schema.
data_surface_resource_test.gallery:
  type: config_object
  label: 'Gallery'
  constraints:
    FullyValidatable: ~
  mapping:
    name:
      type: string
      label: 'Name'
    caption:
      type: string
      label: 'Caption'
      nullable: true
    credit:
      type: string
      label: 'Credit'
      nullable: true
    north:
      type: mapping
      label: 'North wall'
      mapping:
        artwork:
          type: string
          label: 'Artwork'
          nullable: true
        height:
          type: integer
          label: 'Height'
          nullable: true
    south:
      type: mapping
      label: 'South wall'
      mapping:
        artwork:
          type: string
          label: 'Artwork'
          nullable: true
        height:
          type: integer
          label: 'Height'
          nullable: true
    medium:
      type: string
      label: 'Medium'
    finish:
      type: 'data_surface_resource_test.gallery.finish.[%parent.medium]'
      label: 'Finish'
    rooms:
      type: sequence
      label: 'Rooms'
      sequence:
        type: mapping
        label: 'Rooms'
        mapping:
          lights:
            type: boolean
            label: 'Lights'
            nullable: true
            requiredKey: false

# Generated from the resource_test.gallery resource by drush data_surface:config-schema.
data_surface_resource_test.gallery.finish.oil:
