# The digest fixture: a schedule whose shape is the chosen frequency's,
# two of them empty.
data_surface_resource_test.digest:
  type: config_object
  label: 'Digest'
  mapping:
    frequency:
      type: string
      label: 'Frequency'
    schedule:
      type: data_surface_resource_test.digest.schedule.[%parent.frequency]
      label: 'Schedule'

data_surface_resource_test.digest.schedule.daily:
  type: mapping
  label: 'Daily schedule'
  mapping: {  }

data_surface_resource_test.digest.schedule.monthly:
  type: mapping
  label: 'Monthly schedule'
  mapping: {  }

data_surface_resource_test.digest.schedule.weekly:
  type: mapping
  label: 'Weekly schedule'
  mapping:
    send_day:
      type: string
      label: 'Send day'

# The bulletin fixture: a send day that applies only to a weekly bulletin.
data_surface_resource_test.bulletin:
  type: config_object
  label: 'Bulletin'
  mapping:
    frequency:
      type: string
      label: 'Frequency'
    send_day:
      type: string
      label: 'Send day'

# The parcel fixture: every rule between its keys declared as data.
data_surface_resource_test.parcel:
  type: config_object
  label: 'Parcel'
  mapping:
    service:
      type: string
      label: 'Service'
    weight:
      type: integer
      label: 'Weight in kilograms'
    insured:
      type: boolean
      label: 'Insured'
    declared_value:
      type: integer
      label: 'Declared value'
      nullable: true
    reference:
      type: string
      label: 'Reference'
      nullable: true
    signature:
      type: string
      label: 'Signed for by'
      nullable: true
    tracking:
      type: string
      label: 'Tracking code'
      nullable: true
    handling:
      type: string
      label: 'Handling'
      nullable: true
    labels:
      type: sequence
      label: 'Labels'
      sequence:
        type: string
        label: 'Label'
    note:
      type: string
      label: 'Note for the driver'
      nullable: true
    third_party_settings:
      type: sequence
      label: 'Third party settings'
      requiredKey: false
      sequence:
        type: data_surface_resource_test.parcel.third_party.[%key]

# What ParcelAlter mounts on the parcel, under the module's name.
data_surface_resource_test.parcel.third_party.data_surface_resource_test:
  type: mapping
  label: 'Customs'
  mapping:
    courier:
      type: string
      label: 'Courier'
      nullable: true
    customs:
      type: string
      label: 'Customs code'
      nullable: true

# The seating structure's keys, wherever it is attached: the venue's
# seating, the hall's chairs, and the hall's mount for HallSeatingAlter.
# The structure stores nothing itself; each container describes it here.
data_surface_resource_test.seating:
  type: mapping
  label: 'Seating'
  mapping:
    rows:
      type: integer
      label: 'Rows'
    aisle:
      type: string
      label: 'Aisle'
      nullable: true
    ushers:
      type: integer
      label: 'Ushers'
      nullable: true

# The venue fixture: the seating structure, its ports wired to the venue.
data_surface_resource_test.venue:
  type: config_object
  label: 'Venue'
  mapping:
    layout:
      type: string
      label: 'Layout'
    capacity:
      type: integer
      label: 'Capacity'
    seating:
      type: data_surface_resource_test.seating
      label: 'Seating'

# The hall fixture: the seating structure reused as its chairs, and again
# at HallSeatingAlter's mount.
data_surface_resource_test.hall:
  type: config_object
  label: 'Hall'
  mapping:
    arrangement:
      type: string
      label: 'Arrangement'
    style:
      type: string
      label: 'Overflow style'
    guests:
      type: integer
      label: 'Guests'
    chairs:
      type: data_surface_resource_test.seating
      label: 'Chairs'
    third_party_settings:
      type: sequence
      label: 'Third party settings'
      requiredKey: false
      sequence:
        type: data_surface_resource_test.hall.third_party.[%key]

# What HallSeatingAlter mounts on the hall: the seating structure.
data_surface_resource_test.hall.third_party.data_surface_resource_test:
  type: data_surface_resource_test.seating
  label: 'Overflow seating'

# The timestamps structure's keys, for whatever attaches it: the ledger's
# stamps and the archive's. Where a structure is mixed in instead, its
# owner lists the same keys among its own, flat, since a config object's
# mapping already extends config_object and takes no second parent.
data_surface_resource_test.timestamps:
  type: mapping
  label: 'Timestamps'
  mapping:
    created:
      type: integer
      label: 'Created'
      nullable: true
    changed:
      type: integer
      label: 'Changed'
      nullable: true

# The journal fixture: the ownership and the timestamps mixed in, their
# members the journal's own keys, listed flat beside its title.
data_surface_resource_test.journal:
  type: config_object
  label: 'Journal'
  mapping:
    title:
      type: string
      label: 'Title'
    visibility:
      type: string
      label: 'Visibility'
    # Mixed in from resource_test.ownership.
    owner:
      type: string
      label: 'Owner'
    shared:
      type: boolean
      label: 'Shared with editors'
      nullable: true
    # Mixed in from resource_test.timestamps.
    created:
      type: integer
      label: 'Created'
      nullable: true
    changed:
      type: integer
      label: 'Changed'
      nullable: true
    revision:
      type: integer
      label: 'Revision'
      nullable: true
    published:
      type: boolean
      label: 'Published'
      nullable: true
    archive:
      type: mapping
      label: 'Archive'
      mapping:
        shelf:
          type: string
          label: 'Shelf'
        circle:
          type: string
          label: 'Circle'
        # Mixed in from resource_test.ownership.
        owner:
          type: string
          label: 'Owner'
        shared:
          type: boolean
          label: 'Shared with editors'
          nullable: true
        stamps:
          type: data_surface_resource_test.timestamps
          label: 'Archive stamps'

# The ledger fixture: the timestamps structure attached under a key.
data_surface_resource_test.ledger:
  type: config_object
  label: 'Ledger'
  mapping:
    name:
      type: string
      label: 'Name'
    stamps:
      type: data_surface_resource_test.timestamps
      label: 'Stamps'

# The depot fixture: the stock code shape at two keys, and a shelf tag
# reading it through a port.
data_surface_resource_test.depot:
  type: config_object
  label: 'Depot'
  mapping:
    sku:
      type: string
      label: 'Stock code'
    spare:
      type: string
      label: 'Spare code'
      nullable: true
    tag:
      type: mapping
      label: 'Shelf tag'
      mapping:
        label:
          type: string
          label: 'Label'
          nullable: true

# The exhibit fixture: the provenance mixed in, its members listed flat
# beside the title; the loan attached, with its insurance inside it.
data_surface_resource_test.exhibit:
  type: config_object
  label: 'Exhibit'
  mapping:
    title:
      type: string
      label: 'Title'
    status:
      type: string
      label: 'Status'
    room:
      type: string
      label: 'Room'
      nullable: true
    # Mixed in from resource_test.provenance.
    source:
      type: string
      label: 'Source'
      nullable: true
    acquired:
      type: integer
      label: 'Acquired'
      nullable: true
    loan:
      type: mapping
      label: 'Loan'
      mapping:
        lender:
          type: string
          label: 'Lender'
          nullable: true
        until:
          type: integer
          label: 'Until'
          nullable: true
        insurance:
          type: mapping
          label: 'Insurance'
          mapping:
            policy:
              type: string
              label: 'Policy'
              nullable: true
