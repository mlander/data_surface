# The journal fixture: the ownership and the timestamps mixed in, their
# members the journal's own keys, listed flat beside its title.
# Generated from the resource_test.journal resource by drush data_surface:config-schema.
data_surface_resource_test.journal:
  type: config_object
  label: 'Journal'
  constraints:
    FullyValidatable: ~
  mapping:
    title:
      type: string
      label: 'Title'
    visibility:
      type: string
      label: 'Visibility'
    owner:
      type: string
      label: 'Owner'
    shared:
      type: boolean
      label: 'Shared with editors'
      nullable: true
    created:
      type: integer
      label: 'Created'
      nullable: true
      constraints:
        Range:
          min: 0
    changed:
      type: integer
      label: 'Changed'
      nullable: true
      constraints:
        Range:
          min: 0
    revision:
      type: integer
      label: 'Revision'
      nullable: true
      constraints:
        Range:
          min: 1
    published:
      type: boolean
      label: 'Published'
      nullable: true
    archive:
      type: mapping
      label: 'Archive'
      mapping:
        shelf:
          type: string
          label: 'Shelf'
        circle:
          type: string
          label: 'Circle'
        owner:
          type: string
          label: 'Owner'
        shared:
          type: boolean
          label: 'Shared with editors'
          nullable: true
        stamps:
          type: mapping
          label: 'Archive stamps'
          mapping:
            created:
              type: integer
              label: 'Created'
              nullable: true
