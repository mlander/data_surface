# The larder's edit situation as a route, served by the generic form, so
# a test reads what the form draws for a child its access locked or left
# out.
data_surface_surface_test.larder.edit:
  path: '/surface-test/larder/{larder}'
  defaults:
    _form: 'Drupal\data_surface\Form\DataSurfaceSituationForm'
    _title: 'Edit a larder'
    _data_surface_surface: 'Drupal\data_surface_surface_test\Surface\Larder\LarderSurface'
    _data_surface_situation: 'edit'
  requirements:
    _data_surface_situation_access: 'TRUE'

# The larder's stock situation, which hands both racks a context whole.
data_surface_surface_test.larder.stock:
  path: '/surface-test/larder/{larder}/stock'
  defaults:
    _form: 'Drupal\data_surface\Form\DataSurfaceSituationForm'
    _title: 'Stock a larder'
    _data_surface_surface: 'Drupal\data_surface_surface_test\Surface\Larder\LarderSurface'
    _data_surface_situation: 'stock'
  requirements:
    _data_surface_situation_access: 'TRUE'

# The cellar's edit situation, served by the generic form: two
# collections, each with Add another and Remove, over AJAX.
data_surface_surface_test.cellar.edit:
  path: '/surface-test/cellar/{larder}'
  defaults:
    _form: 'Drupal\data_surface\Form\DataSurfaceSituationForm'
    _title: 'Edit a cellar'
    _data_surface_surface: 'Drupal\data_surface_surface_test\Surface\Cellar\CellarSurface'
    _data_surface_situation: 'edit'
  requirements:
    _data_surface_situation_access: 'TRUE'
