<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-labelledby="t">
  <title id="t">The system.performance resource with its three keys: max_age, an integer labeled Browser and proxy cache maximum age with the default 0; css_preprocess and js_preprocess, booleans labeled Aggregate CSS files and Aggregate JavaScript files with the default true</title>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .line { stroke: #D1D9E0; stroke-width: 1.25; }
    .resource { fill: none; stroke: #0969DA; stroke-width: 2; }
    .resource-label { fill: #0969DA; }
    .key { fill: none; stroke: #1F2328; stroke-width: 1.25; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: 600; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151B23; }
      .ink { fill: #F0F6FC; }
      .muted { fill: #9198A1; }
      .line { stroke: #3D444D; }
      .resource { stroke: #4493F8; }
      .resource-label { fill: #4493F8; }
      .key { stroke: #F0F6FC; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="236" rx="12"/>

  <rect class="resource" x="24" y="24" width="672" height="188" rx="10"/>
  <text class="resource-label bold code" x="40" y="50" font-size="15">system.performance</text>

  <text class="muted small" x="290" y="76">label</text>
  <text class="muted small" x="600" y="76">default</text>

  <!-- max_age -->
  <rect class="key" x="40" y="88" width="230" height="26" rx="13"/>
  <text x="54" y="106"><tspan class="ink code small">max_age</tspan><tspan class="muted small"> integer</tspan></text>
  <line class="line" x1="270" y1="101" x2="284" y2="101"/>
  <text class="ink" x="290" y="106">Browser and proxy cache maximum age</text>
  <text class="ink code small" x="600" y="106">0</text>

  <!-- css_preprocess -->
  <rect class="key" x="40" y="130" width="230" height="26" rx="13"/>
  <text x="54" y="148"><tspan class="ink code small">css_preprocess</tspan><tspan class="muted small"> boolean</tspan></text>
  <line class="line" x1="270" y1="143" x2="284" y2="143"/>
  <text class="ink" x="290" y="148">Aggregate CSS files</text>
  <text class="ink code small" x="600" y="148">true</text>

  <!-- js_preprocess -->
  <rect class="key" x="40" y="172" width="230" height="26" rx="13"/>
  <text x="54" y="190"><tspan class="ink code small">js_preprocess</tspan><tspan class="muted small"> boolean</tspan></text>
  <line class="line" x1="270" y1="185" x2="284" y2="185"/>
  <text class="ink" x="290" y="190">Aggregate JavaScript files</text>
  <text class="ink code small" x="600" y="190">true</text>
</svg>
