<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t">
  <title id="t">The my_module.settings resource with its five keys, each with its type, label and default: title, a string labeled Title, default Latest content; items_per_page, an integer labeled Items per page, default 10; show_author, a boolean labeled Show the author, default true; notify_email, an email labeled Email for notices, default admin@example.com; layout, a string labeled Layout, default list</title>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .line { stroke: #D1D9E0; stroke-width: 1.25; }
    .resource { fill: none; stroke: #0969DA; stroke-width: 2; }
    .resource-label { fill: #0969DA; }
    .key { fill: none; stroke: #1F2328; stroke-width: 1.25; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: 600; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151B23; }
      .ink { fill: #F0F6FC; }
      .muted { fill: #9198A1; }
      .line { stroke: #3D444D; }
      .resource { stroke: #4493F8; }
      .resource-label { fill: #4493F8; }
      .key { stroke: #F0F6FC; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="320" rx="12"/>

  <rect class="resource" x="24" y="24" width="672" height="272" rx="10"/>
  <text class="resource-label bold code" x="40" y="50" font-size="15">my_module.settings</text>

  <text class="muted small" x="290" y="76">label</text>
  <text class="muted small" x="480" y="76">default</text>

  <!-- title -->
  <rect class="key" x="40" y="88" width="230" height="26" rx="13"/>
  <text x="54" y="106"><tspan class="ink code small">title</tspan><tspan class="muted small"> string</tspan></text>
  <line class="line" x1="270" y1="101" x2="284" y2="101"/>
  <text class="ink" x="290" y="106">Title</text>
  <text class="ink code small" x="480" y="106">"Latest content"</text>

  <!-- items_per_page -->
  <rect class="key" x="40" y="130" width="230" height="26" rx="13"/>
  <text x="54" y="148"><tspan class="ink code small">items_per_page</tspan><tspan class="muted small"> integer</tspan></text>
  <line class="line" x1="270" y1="143" x2="284" y2="143"/>
  <text class="ink" x="290" y="148">Items per page</text>
  <text class="ink code small" x="480" y="148">10</text>

  <!-- show_author -->
  <rect class="key" x="40" y="172" width="230" height="26" rx="13"/>
  <text x="54" y="190"><tspan class="ink code small">show_author</tspan><tspan class="muted small"> boolean</tspan></text>
  <line class="line" x1="270" y1="185" x2="284" y2="185"/>
  <text class="ink" x="290" y="190">Show the author</text>
  <text class="ink code small" x="480" y="190">true</text>

  <!-- notify_email -->
  <rect class="key" x="40" y="214" width="230" height="26" rx="13"/>
  <text x="54" y="232"><tspan class="ink code small">notify_email</tspan><tspan class="muted small"> email</tspan></text>
  <line class="line" x1="270" y1="227" x2="284" y2="227"/>
  <text class="ink" x="290" y="232">Email for notices</text>
  <text class="ink code small" x="480" y="232">"admin@example.com"</text>

  <!-- layout -->
  <rect class="key" x="40" y="256" width="230" height="26" rx="13"/>
  <text x="54" y="274"><tspan class="ink code small">layout</tspan><tspan class="muted small"> string</tspan></text>
  <line class="line" x1="270" y1="269" x2="284" y2="269"/>
  <text class="ink" x="290" y="274">Layout</text>
  <text class="ink code small" x="480" y="274">"list"</text>
</svg>
