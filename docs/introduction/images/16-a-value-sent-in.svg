<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t">
  <title id="t">One value, limit 60, sent through the form and through the tool; both answer with the same message: This value should be between 1 and 50.</title>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .key { fill: none; stroke: #1F2328; stroke-width: 1.25; }
    .door { fill: none; stroke: #BC4C00; stroke-width: 2; }
    .door-label { fill: #BC4C00; }
    .message { fill: none; stroke: #BF3989; stroke-width: 1.5; }
    .message-label { fill: #BF3989; }
    .arrow { stroke: #59636E; stroke-width: 1.5; fill: none; }
    .arrowhead { fill: #59636E; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: 600; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151B23; }
      .ink { fill: #F0F6FC; }
      .muted { fill: #9198A1; }
      .key { stroke: #F0F6FC; }
      .door { stroke: #F0883E; }
      .door-label { fill: #F0883E; }
      .message { stroke: #E267A8; }
      .message-label { fill: #E267A8; }
      .arrow { stroke: #9198A1; }
      .arrowhead { fill: #9198A1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="220" rx="12"/>

  <!-- One value -->
  <rect class="key" x="24" y="97" width="120" height="26" rx="13"/>
  <text class="ink code small" x="44" y="115">limit: 60</text>

  <!-- Two doors -->
  <path class="door" d="M210 36 h 110 l 12 22 l -12 22 h -110 z"/>
  <text class="door-label bold" x="230" y="63">form</text>
  <path class="door" d="M210 140 h 110 l 12 22 l -12 22 h -110 z"/>
  <text class="door-label bold" x="230" y="167">tool</text>

  <path class="arrow" d="M144 110 C 176 110, 176 58, 200 58"/>
  <path class="arrowhead" d="M209 58 L199 53 L199 63 Z"/>
  <path class="arrow" d="M144 110 C 176 110, 176 162, 200 162"/>
  <path class="arrowhead" d="M209 162 L199 157 L199 167 Z"/>

  <!-- One message -->
  <rect class="message" x="404" y="88" width="292" height="44" rx="6"/>
  <text class="message-label small" x="418" y="115">This value should be between 1 and 50.</text>

  <path class="arrow" d="M332 58 C 368 58, 368 104, 394 104"/>
  <path class="arrowhead" d="M403 104 L393 99 L393 109 Z"/>
  <path class="arrow" d="M332 162 C 368 162, 368 116, 394 116"/>
  <path class="arrowhead" d="M403 116 L393 111 L393 121 Z"/>
</svg>
