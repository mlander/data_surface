<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t">
<title id="t">The teaser block's settings, a structure with no id, nowhere saved by itself and nothing to ask for, used only through the placed block, block.placement, a resource with an id, saved as a config entity, with create, update and delete, which holds them under settings</title>
<style>
.bg{fill:#F6F8FA}
.ink{fill:#1F2328}
.muted{fill:#59636E}
.res{fill:none;stroke:#0969DA;stroke-width:2}
.resT{fill:#0969DA}
.str{fill:none;stroke:#1A7F64;stroke-width:2;stroke-dasharray:6 4}
.strT{fill:#1A7F64}
.key{fill:#F6F8FA;stroke:#1F2328;stroke-width:1.25}
.arrow{fill:none;stroke:#59636E;stroke-width:1.5}
.head{fill:#59636E}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.b{font-weight:600}
.s{font-size:13px}
@media (prefers-color-scheme: dark){
.bg{fill:#151B23}
.ink{fill:#F0F6FC}
.muted{fill:#9198A1}
.res{stroke:#4493F8}
.resT{fill:#4493F8}
.str{stroke:#3FB993}
.strT{fill:#3FB993}
.key{fill:#151B23;stroke:#F0F6FC}
.arrow{stroke:#9198A1}
.head{fill:#9198A1}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="720" height="300" rx="12"/>

<!-- The structure on its own -->
<rect class="str" x="24" y="48" width="290" height="130" rx="10"/>
<text class="strT b mono" x="40" y="74">block.my_teaser</text>
<rect class="key" x="40" y="88" width="210" height="26" rx="13"/><text x="54" y="106"><tspan class="mono ink">headline</tspan><tspan class="mono muted" dx="8">string</tspan></text>
<rect class="key" x="40" y="128" width="210" height="26" rx="13"/><text x="54" y="146"><tspan class="mono ink">limit</tspan><tspan class="mono muted" dx="8">integer</tspan></text>
<text class="muted s" x="24" y="204">no id</text>
<text class="muted s" x="24" y="224">not saved by itself</text>
<text class="muted s" x="24" y="244">nothing to ask for by itself</text>

<!-- The resource that holds it -->
<rect class="res" x="400" y="24" width="296" height="226" rx="10"/>
<text class="resT b mono" x="416" y="50">block.placement</text>
<text class="muted s" x="416" y="76"><tspan class="ink">id</tspan> teaser_front</text>
<text class="muted s" x="416" y="98"><tspan class="ink">saved as</tspan> block.block.teaser_front</text>
<text class="muted s" x="416" y="120"><tspan class="ink">asked for by</tspan> create, update, delete</text>
<rect class="str" x="416" y="138" width="264" height="94" rx="10"/>
<text class="strT b mono" x="432" y="162">settings</text>
<text class="muted mono" x="432" y="188">headline</text>
<text class="muted mono" x="432" y="212">limit</text>

<line class="arrow" x1="314" y1="140" x2="412" y2="182" marker-end="url(#ah)"/>

<text class="ink" x="24" y="280">The settings are used only through the placed block that holds them.</text>
</svg>
