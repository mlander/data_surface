<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="t">
<title id="t">The block.placement resource with three operations, each asking administer blocks, from which a route and a tool are made</title>
<style>
.bg{fill:#F6F8FA}
.ink{fill:#1F2328}
.muted{fill:#59636E}
.res{fill:none;stroke:#0969DA;stroke-width:2}
.resource-fill{fill:#F6F8FA;stroke:#0969DA;stroke-width:2}
.resT{fill:#0969DA}
.str{fill:none;stroke:#1A7F64;stroke-width:2;stroke-dasharray:6 4}
.strT{fill:#1A7F64}
.key{fill:#F6F8FA;stroke:#1F2328;stroke-width:1.25}
.box{fill:none;stroke:#1F2328;stroke-width:1.5}
.door{fill:none;stroke:#BC4C00;stroke-width:2}
.doorT{fill:#BC4C00}
.arrow{fill:none;stroke:#59636E;stroke-width:1.5}
.head{fill:#59636E}
.rule{fill:none;stroke:#D1D9E0;stroke-width:1}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.b{font-weight:600}
.s{font-size:13px}
@media (prefers-color-scheme: dark){
.bg{fill:#151B23}
.ink{fill:#F0F6FC}
.muted{fill:#9198A1}
.res{stroke:#4493F8}
.resource-fill{fill:#151B23;stroke:#4493F8}
.resT{fill:#4493F8}
.str{stroke:#3FB993}
.strT{fill:#3FB993}
.key{fill:#151B23;stroke:#F0F6FC}
.box{stroke:#F0F6FC}
.door{stroke:#F0883E}
.doorT{fill:#F0883E}
.arrow{stroke:#9198A1}
.head{fill:#9198A1}
.rule{stroke:#3D444D}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="720" height="304" rx="12"/>
<rect class="res" x="24" y="40" width="200" height="216" rx="10"/><text class="resT b mono" x="38" y="64">block.placement</text>
<rect class="key" x="40" y="76" width="160" height="26" rx="13"/><text x="54" y="94"><tspan class="mono ink">id</tspan><tspan class="mono muted" dx="8">string</tspan></text>
<text class="muted s" x="40" y="128">identity: id</text>
<rect class="box" x="290" y="40" width="200" height="52" rx="8"/><text class="ink b mono" x="306" y="62">create</text><text class="muted s" x="306" y="82">administer blocks</text>
<line class="arrow" x1="224" y1="66" x2="286" y2="66" marker-end="url(#ah)"/>
<rect class="box" x="290" y="122" width="200" height="52" rx="8"/><text class="ink b mono" x="306" y="144">update</text><text class="muted s" x="306" y="164">administer blocks</text>
<line class="arrow" x1="224" y1="148" x2="286" y2="148" marker-end="url(#ah)"/>
<rect class="box" x="290" y="204" width="200" height="52" rx="8"/><text class="ink b mono" x="306" y="226">delete</text><text class="muted s" x="306" y="246">administer blocks</text>
<line class="arrow" x1="224" y1="230" x2="286" y2="230" marker-end="url(#ah)"/>
<line class="arrow" x1="490" y1="66" x2="520" y2="66"/><line class="arrow" x1="490" y1="148" x2="520" y2="148"/><line class="arrow" x1="490" y1="230" x2="520" y2="230"/>
<line class="arrow" x1="520" y1="66" x2="520" y2="230"/>
<path class="arrow" d="M520,104 H560" marker-end="url(#ah)"/>
<path class="arrow" d="M520,192 H560" marker-end="url(#ah)"/>
<path class="door" d="M564,82 h118 l14,22.0 l-14,22.0 h-118 z"/><text class="doorT b" x="578" y="109.0">route</text>
<path class="door" d="M564,170 h118 l14,22.0 l-14,22.0 h-118 z"/><text class="doorT b" x="578" y="197.0">tool</text>
