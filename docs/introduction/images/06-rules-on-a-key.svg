<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-labelledby="t">
  <title id="t">The my_module.settings resource with three of its keys and their rules: title, a string, is required and at most 64 characters; items_per_page, an integer, is required and between 1 and 50; layout, a string, is required and one of list or grid</title>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .resource { fill: none; stroke: #0969DA; stroke-width: 2; }
    .resource-label { fill: #0969DA; }
    .key { fill: none; stroke: #1F2328; stroke-width: 1.25; }
    .rule { fill: none; stroke: #BF3989; stroke-width: 1.5; }
    .rule-line { stroke: #BF3989; stroke-width: 1.5; }
    .rule-label { fill: #BF3989; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: 600; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151B23; }
      .ink { fill: #F0F6FC; }
      .muted { fill: #9198A1; }
      .resource { stroke: #4493F8; }
      .resource-label { fill: #4493F8; }
      .key { stroke: #F0F6FC; }
      .rule { stroke: #E267A8; }
      .rule-line { stroke: #E267A8; }
      .rule-label { fill: #E267A8; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="236" rx="12"/>

  <rect class="resource" x="24" y="24" width="672" height="188" rx="10"/>
  <text class="resource-label bold code" x="40" y="50" font-size="15">my_module.settings</text>

  <!-- title and its rules -->
  <rect class="key" x="40" y="70" width="230" height="26" rx="13"/>
  <text x="54" y="88"><tspan class="ink code small">title</tspan><tspan class="muted small"> string</tspan></text>
  <line class="rule-line" x1="270" y1="83" x2="286" y2="83"/>
  <rect class="rule" x="286" y="72" width="81" height="22" rx="6"/>
  <text class="rule-label small" x="298" y="88">required</text>
  <rect class="rule" x="377" y="72" width="175" height="22" rx="6"/>
  <text class="rule-label small" x="389" y="88">at most 64 characters</text>

  <!-- items_per_page and its rules -->
  <rect class="key" x="40" y="116" width="230" height="26" rx="13"/>
  <text x="54" y="134"><tspan class="ink code small">items_per_page</tspan><tspan class="muted small"> integer</tspan></text>
  <line class="rule-line" x1="270" y1="129" x2="286" y2="129"/>
  <rect class="rule" x="286" y="118" width="81" height="22" rx="6"/>
  <text class="rule-label small" x="298" y="134">required</text>
  <rect class="rule" x="377" y="118" width="139" height="22" rx="6"/>
  <text class="rule-label small" x="389" y="134">between 1 and 50</text>

  <!-- layout and its rules -->
  <rect class="key" x="40" y="162" width="230" height="26" rx="13"/>
  <text x="54" y="180"><tspan class="ink code small">layout</tspan><tspan class="muted small"> string</tspan></text>
  <line class="rule-line" x1="270" y1="175" x2="286" y2="175"/>
  <rect class="rule" x="286" y="164" width="81" height="22" rx="6"/>
  <text class="rule-label small" x="298" y="180">required</text>
  <rect class="rule" x="377" y="164" width="110" height="22" rx="6"/>
  <text class="rule-label small" x="389" y="180">list or grid</text>
</svg>
