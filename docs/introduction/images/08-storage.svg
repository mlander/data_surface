<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-labelledby="t">
<title id="t">Each key of my_module.settings saved under its own name in the my_module.settings config object, which MySettingsStorage reads and writes</title>
<style>
.bg{fill:#F6F8FA}
.ink{fill:#1F2328}
.muted{fill:#59636E}
.res{fill:none;stroke:#0969DA;stroke-width:2}
.resource-fill{fill:#F6F8FA;stroke:#0969DA;stroke-width:2}
.resT{fill:#0969DA}
.str{fill:none;stroke:#1A7F64;stroke-width:2;stroke-dasharray:6 4}
.strT{fill:#1A7F64}
.key{fill:#F6F8FA;stroke:#1F2328;stroke-width:1.25}
.box{fill:none;stroke:#1F2328;stroke-width:1.5}
.door{fill:none;stroke:#BC4C00;stroke-width:2}
.doorT{fill:#BC4C00}
.arrow{fill:none;stroke:#59636E;stroke-width:1.5}
.head{fill:#59636E}
.rule{fill:none;stroke:#D1D9E0;stroke-width:1}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.b{font-weight:600}
.s{font-size:13px}
@media (prefers-color-scheme: dark){
.bg{fill:#151B23}
.ink{fill:#F0F6FC}
.muted{fill:#9198A1}
.res{stroke:#4493F8}
.resource-fill{fill:#151B23;stroke:#4493F8}
.resT{fill:#4493F8}
.str{stroke:#3FB993}
.strT{fill:#3FB993}
.key{fill:#151B23;stroke:#F0F6FC}
.box{stroke:#F0F6FC}
.door{stroke:#F0883E}
.doorT{fill:#F0883E}
.arrow{stroke:#9198A1}
.head{fill:#9198A1}
.rule{stroke:#3D444D}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="720" height="316" rx="12"/>
<rect class="res" x="24" y="40" width="280" height="228" rx="10"/><text class="resT b mono" x="38" y="64">my_module.settings</text>
<rect class="box" x="420" y="40" width="276" height="228" rx="4"/><text class="ink b" x="436" y="64">config object</text>
<rect class="key" x="40" y="80" width="232" height="26" rx="13"/><text x="54" y="98"><tspan class="mono ink">title</tspan><tspan class="mono muted" dx="8">string</tspan></text>
<text class="ink mono" x="436" y="98">title</text>
<line class="arrow" x1="272" y1="93" x2="428" y2="93" marker-end="url(#ah)"/>
<rect class="key" x="40" y="116" width="232" height="26" rx="13"/><text x="54" y="134"><tspan class="mono ink">items_per_page</tspan><tspan class="mono muted" dx="8">integer</tspan></text>
<text class="ink mono" x="436" y="134">items_per_page</text>
<line class="arrow" x1="272" y1="129" x2="428" y2="129" marker-end="url(#ah)"/>
<rect class="key" x="40" y="152" width="232" height="26" rx="13"/><text x="54" y="170"><tspan class="mono ink">show_author</tspan><tspan class="mono muted" dx="8">boolean</tspan></text>
<text class="ink mono" x="436" y="170">show_author</text>
<line class="arrow" x1="272" y1="165" x2="428" y2="165" marker-end="url(#ah)"/>
<rect class="key" x="40" y="188" width="232" height="26" rx="13"/><text x="54" y="206"><tspan class="mono ink">notify_email</tspan><tspan class="mono muted" dx="8">email</tspan></text>
<text class="ink mono" x="436" y="206">notify_email</text>
<line class="arrow" x1="272" y1="201" x2="428" y2="201" marker-end="url(#ah)"/>
<rect class="key" x="40" y="224" width="232" height="26" rx="13"/><text x="54" y="242"><tspan class="mono ink">layout</tspan><tspan class="mono muted" dx="8">string</tspan></text>
<text class="ink mono" x="436" y="242">layout</text>
<line class="arrow" x1="272" y1="237" x2="428" y2="237" marker-end="url(#ah)"/>
<text class="ink" x="24" y="296">storage: MySettingsStorage reads and writes the my_module.settings config object</text>
</svg>
