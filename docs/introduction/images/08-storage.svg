.rule{stroke:#3D444D}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="720" height="268" rx="12"/>
<rect class="res" x="24" y="40" width="280" height="176" rx="10"/><text class="resT b mono" x="38" y="64">system.performance</text>
<rect class="key" x="40" y="84" width="232" height="26" rx="13"/><text x="54" y="102"><tspan class="mono ink">max_age</tspan><tspan class="mono muted" dx="8">integer</tspan></text>
<rect class="key" x="40" y="126" width="232" height="26" rx="13"/><text x="54" y="144"><tspan class="mono ink">css_preprocess</tspan><tspan class="mono muted" dx="8">boolean</tspan></text>
<rect class="key" x="40" y="168" width="232" height="26" rx="13"/><text x="54" y="186"><tspan class="mono ink">js_preprocess</tspan><tspan class="mono muted" dx="8">boolean</tspan></text>
<rect class="box" x="420" y="40" width="276" height="176" rx="4"/><text class="ink b" x="436" y="64">config object</text><text class="muted mono" x="436" y="84">system.performance</text>
<text class="ink mono" x="436" y="108">cache.page.max_age</text>
