<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img" aria-labelledby="t">
<title id="t">Each key of system.performance saved at its own path in the system.performance config object</title>
<style>
.bg{fill:#F6F8FA}
.ink{fill:#1F2328}
.muted{fill:#59636E}
