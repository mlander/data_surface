<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 274" role="img" aria-labelledby="t">
<title id="t">A block plugin holding a structure of two keys, whose values the plugin configuration saves</title>
<style>
.bg{fill:#F6F8FA}
.ink{fill:#1F2328}
.muted{fill:#59636E}
.res{fill:none;stroke:#0969DA;stroke-width:2}
.resource-fill{fill:#F6F8FA;stroke:#0969DA;stroke-width:2}
.resT{fill:#0969DA}
.str{fill:none;stroke:#1A7F64;stroke-width:2;stroke-dasharray:6 4}
.strT{fill:#1A7F64}
.key{fill:#F6F8FA;stroke:#1F2328;stroke-width:1.25}
.box{fill:none;stroke:#1F2328;stroke-width:1.5}
.door{fill:none;stroke:#BC4C00;stroke-width:2}
.doorT{fill:#BC4C00}
.arrow{fill:none;stroke:#59636E;stroke-width:1.5}
.head{fill:#59636E}
.rule{fill:none;stroke:#D1D9E0;stroke-width:1}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.b{font-weight:600}
.s{font-size:13px}
@media (prefers-color-scheme: dark){
.bg{fill:#151B23}
.ink{fill:#F0F6FC}
.muted{fill:#9198A1}
.res{stroke:#4493F8}
.resource-fill{fill:#151B23;stroke:#4493F8}
.resT{fill:#4493F8}
.str{stroke:#3FB993}
.strT{fill:#3FB993}
.key{fill:#151B23;stroke:#F0F6FC}
.box{stroke:#F0F6FC}
.door{stroke:#F0883E}
.doorT{fill:#F0883E}
.arrow{stroke:#9198A1}
.head{fill:#9198A1}
.rule{stroke:#3D444D}
}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="720" height="274" rx="12"/>
<rect class="box" x="24" y="32" width="340" height="190" rx="8"/><text class="ink b" x="40" y="56">block plugin</text><text class="muted mono" x="140" y="56">my_teaser</text>
<rect class="str" x="44" y="72" width="300" height="132" rx="10"/><text class="strT b mono" x="58" y="96">block.my_teaser</text>
<rect class="key" x="64" y="112" width="220" height="26" rx="13"/><text x="78" y="130"><tspan class="mono ink">headline</tspan><tspan class="mono muted" dx="8">string</tspan></text>
<rect class="key" x="64" y="152" width="220" height="26" rx="13"/><text x="78" y="170"><tspan class="mono ink">limit</tspan><tspan class="mono muted" dx="8">integer</tspan></text>
<line class="arrow" x1="364" y1="127" x2="446" y2="127" marker-end="url(#ah)"/>
<rect class="box" x="450" y="92" width="246" height="70" rx="4"/><text class="ink b" x="466" y="122">plugin configuration</text><text class="muted s" x="466" y="144">where the values are saved</text>
<text class="ink" x="24" y="254">structure: keys only; no identity, storage or operations of its own</text>

</svg>
