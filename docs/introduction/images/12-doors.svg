<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t">
  <title id="t">One resource, block.placement, with its create operation, and arrows to four doors: the form, a Tool API tool that the command line, ECA, MCP and AI agents run, HTTP with an OpenAPI document, and a React page</title>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .line { stroke: #D1D9E0; }
    .resource { fill: none; stroke: #0969DA; stroke-width: 2; }
    .resource-label { fill: #0969DA; }
    .door { fill: none; stroke: #BC4C00; stroke-width: 2; }
    .door-label { fill: #BC4C00; }
    .arrow { stroke: #59636E; stroke-width: 1.5; fill: none; }
    .arrowhead { fill: #59636E; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: 600; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151B23; }
      .ink { fill: #F0F6FC; }
      .muted { fill: #9198A1; }
      .line { stroke: #3D444D; }
      .resource { stroke: #4493F8; }
      .resource-label { fill: #4493F8; }
      .door { stroke: #F0883E; }
      .door-label { fill: #F0883E; }
      .arrow { stroke: #9198A1; }
      .arrowhead { fill: #9198A1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="320" rx="12"/>

  <!-- The resource and its operation -->
  <rect class="resource" x="32" y="100" width="200" height="120" rx="10"/>
  <text class="resource-label bold code" x="48" y="128" font-size="15">block.placement</text>
  <text class="muted small" x="48" y="168">operation</text>
  <text class="ink code" x="48" y="192" font-size="15">create</text>

  <!-- Arrows from the resource to each door -->
  <path class="arrow" d="M232 160 C 280 160, 290 58, 326 58"/>
  <path class="arrowhead" d="M334 58 L324 53 L324 63 Z"/>
  <path class="arrow" d="M232 160 C 280 160, 290 126, 326 126"/>
  <path class="arrowhead" d="M334 126 L324 121 L324 131 Z"/>
  <path class="arrow" d="M232 160 C 280 160, 290 194, 326 194"/>
  <path class="arrowhead" d="M334 194 L324 189 L324 199 Z"/>
  <path class="arrow" d="M232 160 C 280 160, 290 262, 326 262"/>
  <path class="arrowhead" d="M334 262 L324 257 L324 267 Z"/>

  <!-- Doors: a rectangle with an arrow notch on the right -->
  <path class="door" d="M340 38 H668 L688 58 L668 78 H340 Z"/>
  <text class="door-label bold" x="356" y="63">The form</text>

  <path class="door" d="M340 106 H668 L688 126 L668 146 H340 Z"/>
  <text class="door-label bold" x="356" y="122">A Tool API tool</text>
  <text class="muted small" x="356" y="139">run by the command line, ECA, MCP and AI agents</text>

  <path class="door" d="M340 174 H668 L688 194 L668 214 H340 Z"/>
  <text class="door-label bold" x="356" y="199">HTTP with OpenAPI</text>

  <path class="door" d="M340 242 H668 L688 262 L668 282 H340 Z"/>
  <text class="door-label bold" x="356" y="267">A React page</text>
</svg>
