<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t">
  <title id="t">A module's settings, my_module.settings, described once with five values on the left; arrows to a form, a Tool API tool, the command line, an HTTP API and a React page on the right, each asking for the same five values</title>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .line { stroke: #D1D9E0; }
    .resource { fill: none; stroke: #0969DA; stroke-width: 2; }
    .resource-label { fill: #0969DA; }
    .key { fill: none; stroke: #1F2328; stroke-width: 1.25; }
    .door { fill: none; stroke: #BC4C00; stroke-width: 2; }
    .door-label { fill: #BC4C00; }
    .arrow { stroke: #59636E; stroke-width: 1.5; fill: none; }
    .arrowhead { fill: #59636E; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: 600; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151B23; }
      .ink { fill: #F0F6FC; }
      .muted { fill: #9198A1; }
      .line { stroke: #3D444D; }
      .resource { stroke: #4493F8; }
      .resource-label { fill: #4493F8; }
      .key { stroke: #F0F6FC; }
      .door { stroke: #F0883E; }
      .door-label { fill: #F0883E; }
      .arrow { stroke: #9198A1; }
      .arrowhead { fill: #9198A1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="360" rx="12"/>

  <!-- The thing, described once, with its five values -->
  <rect class="resource" x="24" y="58" width="260" height="244" rx="10"/>
  <text class="resource-label bold code" x="40" y="84" font-size="15">my_module.settings</text>
  <text class="muted small" x="40" y="104">your module's settings</text>
  <rect class="key" x="40" y="118" width="228" height="26" rx="13"/>
  <text x="54" y="136"><tspan class="ink code small">title</tspan><tspan class="muted small"> string</tspan></text>
  <rect class="key" x="40" y="152" width="228" height="26" rx="13"/>
  <text x="54" y="170"><tspan class="ink code small">items_per_page</tspan><tspan class="muted small"> integer</tspan></text>
  <rect class="key" x="40" y="186" width="228" height="26" rx="13"/>
  <text x="54" y="204"><tspan class="ink code small">show_author</tspan><tspan class="muted small"> boolean</tspan></text>
  <rect class="key" x="40" y="220" width="228" height="26" rx="13"/>
  <text x="54" y="238"><tspan class="ink code small">notify_email</tspan><tspan class="muted small"> email</tspan></text>
  <rect class="key" x="40" y="254" width="228" height="26" rx="13"/>
  <text x="54" y="272"><tspan class="ink code small">layout</tspan><tspan class="muted small"> string</tspan></text>

  <!-- Arrows to each place that asks for the values -->
  <path class="arrow" d="M284 180 C 330 180, 330 52, 362 52"/>
  <path class="arrowhead" d="M370 52 L360 47 L360 57 Z"/>
  <path class="arrow" d="M284 180 C 330 180, 330 116, 362 116"/>
  <path class="arrowhead" d="M370 116 L360 111 L360 121 Z"/>
  <path class="arrow" d="M284 180 H362"/>
  <path class="arrowhead" d="M370 180 L360 175 L360 185 Z"/>
  <path class="arrow" d="M284 180 C 330 180, 330 244, 362 244"/>
  <path class="arrowhead" d="M370 244 L360 239 L360 249 Z"/>
  <path class="arrow" d="M284 180 C 330 180, 330 308, 362 308"/>
  <path class="arrowhead" d="M370 308 L360 303 L360 313 Z"/>

  <!-- Each asks for the same five values -->
  <path class="door" d="M376 24 H676 L696 52 L676 80 H376 Z"/>
  <text class="door-label bold" x="392" y="46">The form</text>
  <text class="muted small" x="392" y="66">the same five values</text>

  <path class="door" d="M376 88 H676 L696 116 L676 144 H376 Z"/>
  <text class="door-label bold" x="392" y="110">A Tool API tool</text>
  <text class="muted small" x="392" y="130">the same five values</text>

  <path class="door" d="M376 152 H676 L696 180 L676 208 H376 Z"/>
  <text class="door-label bold" x="392" y="174">The command line</text>
  <text class="muted small" x="392" y="194">the same five values</text>

  <path class="door" d="M376 216 H676 L696 244 L676 272 H376 Z"/>
  <text class="door-label bold" x="392" y="238">An HTTP API</text>
  <text class="muted small" x="392" y="258">the same five values</text>

  <path class="door" d="M376 280 H676 L696 308 L676 336 H376 Z"/>
  <text class="door-label bold" x="392" y="302">A React page</text>
  <text class="muted small" x="392" y="322">the same five values</text>
</svg>
