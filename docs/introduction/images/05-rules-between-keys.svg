<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t">
  <title id="t">The block.placement resource with two keys, theme and region; an arrow from theme to a rule on region that says a region of the theme chosen, worked out from the value of theme alone</title>
  <style>
    .bg { fill: #F6F8FA; }
    .ink { fill: #1F2328; }
    .muted { fill: #59636E; }
    .resource { fill: none; stroke: #0969DA; stroke-width: 2; }
    .resource-label { fill: #0969DA; }
    .key { fill: none; stroke: #1F2328; stroke-width: 1.25; }
    .rule { fill: none; stroke: #BF3989; stroke-width: 1.5; }
    .rule-line { stroke: #BF3989; stroke-width: 1.5; }
    .rule-label { fill: #BF3989; }
    .arrow { stroke: #59636E; stroke-width: 1.5; fill: none; }
    .arrowhead { fill: #59636E; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bold { font-weight: 600; }
    .small { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #151B23; }
      .ink { fill: #F0F6FC; }
      .muted { fill: #9198A1; }
      .resource { stroke: #4493F8; }
      .resource-label { fill: #4493F8; }
      .key { stroke: #F0F6FC; }
      .rule { stroke: #E267A8; }
      .rule-line { stroke: #E267A8; }
      .rule-label { fill: #E267A8; }
      .arrow { stroke: #9198A1; }
      .arrowhead { fill: #9198A1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="720" height="230" rx="12"/>

  <rect class="resource" x="24" y="24" width="672" height="182" rx="10"/>
  <text class="resource-label bold code" x="40" y="50" font-size="15">block.placement</text>

  <!-- The key that is watched -->
  <rect class="key" x="40" y="70" width="190" height="26" rx="13"/>
  <text x="54" y="88"><tspan class="ink code small">theme</tspan><tspan class="muted small"> string</tspan></text>

  <!-- The key whose rule depends on it -->
  <rect class="key" x="40" y="138" width="190" height="26" rx="13"/>
  <text x="54" y="156"><tspan class="ink code small">region</tspan><tspan class="muted small"> string</tspan></text>
  <line class="rule-line" x1="230" y1="151" x2="246" y2="151"/>
  <rect class="rule" x="246" y="140" width="216" height="22" rx="6"/>
  <text class="rule-label small" x="258" y="156">a region of the theme chosen</text>

  <!-- theme decides the rule -->
  <path class="arrow" d="M230 83 C 330 83, 354 96, 354 128"/>
  <path class="arrowhead" d="M354 137 L349 127 L359 127 Z"/>

  <text class="muted small" x="40" y="192">A refiner: worked out from the value of theme alone, ahead of time.</text>
</svg>
