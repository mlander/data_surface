# mkdocs configuration for the Data Surface module.
# Docs live under docs/, entry point docs/index.md.
# Published to GitLab Pages at the site_url below.
site_name: Data Surface
site_url: https://project.pages.drupalcode.org/data_surface

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

nav:
  - Home: index.md
  - Your first resource: first-resource.md
  - Your second resource: second-resource.md
  - Generating a resource: generating.md
  - Concepts: concepts.md
  - Transformations: transformations.md
  - Common settings recipes: recipes.md
  - Installation: installation.md
  - The pattern: pattern.md
  - How it fits: how-it-fits.md
  - Resources and structures: resources.md
  - Reading a schema: reading-a-schema.md
  - Catalog: catalog.md
  - "The site's catalog": catalog-command.md
  - Content entities: entities.md
  - Declaring a resource: declaring-a-resource.md
  - Decisions: decisions.md
  - Performance: performance.md
  - Values:
      - The pipeline: pipeline.md
      - Value semantics: semantics.md
      - Outputs: outputs.md
      - Storage: storage.md
  - Forms:
      - Generated forms: forms.md
      - Widgets: widgets.md
      - Options and resolvers: options.md
      - The served contract: served-contract.md
      - Evolving a resource: evolution.md
      - Testing a resource: testing-a-resource.md
      - 'Audit: never stricter': audit-never-stricter.md
  - Extending a resource or structure:
      - Refinement and contributions: refinement.md
  - For core:
      - Adoption catalog: adoption.md
      - Core gaps: core-gaps.md
  - Evidence:
      - 'Fresh eyes, 2026-10-18': fresh-eyes-2026-10-18.md
      - 'Fresh eyes, 2026-10-19': fresh-eyes-2026-10-19.md
      - 'Two adopters, 2026-10-19': adopters-2026-10-19.md
