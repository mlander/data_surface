include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # The module declares core_version_requirement ^11.3 || ^12, so there
  # is no previous major to test against: Drupal 10 cannot install it.
  OPT_IN_TEST_PREVIOUS_MAJOR: 0
  OPT_IN_TEST_NEXT_MINOR: 1
  # Turn this on once Drupal 12 has a branch to test against.
  OPT_IN_TEST_NEXT_MAJOR: 0
  OPT_IN_TEST_CURRENT: 1
  RUN_JOB_UPGRADE_STATUS: 0
  _PHPUNIT_CONCURRENT: 1
  _CSPELL_IGNORE_PATHS: "'.cspell-project-words.txt'"

# The template's docs job builds mkdocs.yml and publishes docs/ to
# GitLab Pages. Enabled now that the docs tree exists.
pages:
  stage: .post

# The address and tool modules are optional at runtime, which is why they
# are suggestions rather than requirements, but the two bridge submodules
# and their kernel tests need them present. The template installs the
# project's own require-dev, so they are declared there; see composer.json.

cspell:
  allow_failure: false
stylelint:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
