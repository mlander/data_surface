# Generated from the first.newsletter resource by drush data_surface:config-schema.
data_surface_first.newsletter:
  type: config_object
  label: 'Newsletter settings'
  constraints:
    FullyValidatable: ~
  mapping:
    sender_name:
      type: string
      label: 'Sender name'
      constraints:
        Length:
          max: 64
    sender_email:
      type: email
      label: 'Sender email'
    frequency:
      type: string
      label: 'Frequency'
    max_recipients:
      type: integer
      label: 'Maximum recipients per send'
      nullable: true
      constraints:
        Range:
          min: 1
          max: 10000

# Generated from the first.store resource by drush data_surface:config-schema.
data_surface_first.store:
  type: config_object
  label: 'Store location'
  constraints:
    FullyValidatable: ~
  mapping:
    country:
      type: string
      label: 'Country'
    region:
      type: string
      label: 'Region'
