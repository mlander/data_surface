services:
  # Deprecated: the old-spelling provider, kept for the documentation and
  # the provider spelling of the generic form until the provider contract
  # is deleted. Nothing in this module routes to it any more;
  # Surface\NodeTypeSurface is the content type surface.
  data_surface_demo_node_type.provider:
    class: Drupal\data_surface_demo_node_type\NodeTypeSurfaceProvider
    arguments:
      - '@data_surface.factory'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@config.typed'
      - '@current_user'
      - '@string_translation'
  # The cosmetic layer the two routes name beside the situation: the
  # vertical tabs, the machine name mirror, the message and the redirect,
  # which is all a form class is still for here.
  data_surface_demo_node_type.form_cosmetics:
    class: Drupal\data_surface_demo_node_type\Form\NodeTypeSurfaceFormCosmetics
    arguments: ['@string_translation']
