name: 'Surface API examples: component block'
type: module
description: 'A block that embeds a single-directory component: the component chosen from the components the site has, and its props read from the schema the component declares. It applies the pattern to core''s single-directory components to test it, and is not part of the project in this form.'
package: 'Surface API examples'
lifecycle: experimental
lifecycle_link: 'https://git.drupalcode.org/project/surface/-/blob/1.0.x/README.md#the-examples'
core_version_requirement: ^11.3 || ^12
dependencies:
  - surface:surface
  - drupal:block
