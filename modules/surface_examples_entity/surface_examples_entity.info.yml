name: 'Surface API examples: content entities'
type: module
description: 'Derives a resource for every content entity bundle with a form display, one child per field derived from its typed data, with field access as each child''s access; add and edit a basic page through it. It applies the pattern to core''s content entities to test it, and is not part of the project in this form.'
package: 'Surface API examples'
lifecycle: experimental
lifecycle_link: 'https://git.drupalcode.org/project/surface/-/blob/1.0.x/README.md#the-examples'
core_version_requirement: ^11.3 || ^12
dependencies:
  - surface:surface
  - drupal:node
