services:
  # Builds the OpenAPI document: every resource operation that can be asked
  # on its own, its paths on the API, and its full schema, built for no
  # account, as components.
  data_surface_openapi.document:
    class: Drupal\data_surface_openapi\OpenApiDocument
    arguments:
      - '@data_surface.resource_registry'
      - '@data_surface.resources'
      - '@data_surface.resource_plugins'
      - '@data_surface.contract_emitter'
      - '@data_surface.pipeline'
      - '@data_surface_react.served_paths'
      - '@config.factory'
      - '@module_handler'
      - '@session_configuration'
      - '@account_switcher'
      - '@logger.channel.data_surface'
      - '@string_translation'
  # The OpenAPI operation that runs an operation, for the site catalog.
  data_surface_openapi.catalog_doors:
    class: Drupal\data_surface_openapi\OpenApiDoors
    arguments: ['@data_surface_react.served_paths']
    tags:
      - { name: data_surface.catalog_doors, priority: 10 }
