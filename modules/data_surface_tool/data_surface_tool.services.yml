services:
  data_surface_tool.field_surface_locator:
    class: Drupal\data_surface_tool\FieldSurfaceLocator
    arguments: ['@typed_data_manager', '@entity_type.manager']
  data_surface_tool.field_type_resolver:
    class: Drupal\data_surface_tool\FieldTypeSurfaceResolver
    arguments: ['@data_surface_tool.field_surface_locator']
    tags:
      - { name: data_surface.surface_resolver }
  data_surface_tool.field_instance_provider:
    class: Drupal\data_surface_tool\FieldInstanceSurfaceProvider
    arguments: ['@data_surface_tool.field_surface_locator', '@data_surface.factory', '@entity_type.manager', '@current_user', '@string_translation']
  data_surface_tool.input_definitions:
    class: Drupal\data_surface_tool\SurfaceInputDefinitions
    arguments: ['@data_surface.options', '@string_translation']
