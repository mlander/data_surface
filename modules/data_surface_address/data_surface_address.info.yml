name: Data Surface - Address field settings
type: module
description: 'Describes the address field type''s instance settings as a surface and lets Field UI render the generated form, without changing the address module: the field type class is swapped for a subclass through hook_field_info_alter().'
package: Data Surface
lifecycle: experimental
lifecycle_link: 'https://git.drupalcode.org/project/data_surface/-/blob/1.0.x/README.md#experimental-submodules'
core_version_requirement: ^11.3 || ^12
dependencies:
  - data_surface:data_surface
  - address:address
