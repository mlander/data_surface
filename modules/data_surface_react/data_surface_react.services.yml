services:
  # Resolves a resource id, an operation id and its parameters into the
  # context, the built resource and its storage, and answers access.
  data_surface_react.served_operations:
    class: Drupal\data_surface_react\ServedOperations
    arguments: ['@data_surface.resource_registry', '@data_surface.resources']
  # Reads which operation a path and a method name, and writes the path of
  # an operation: contract 3's paths.
  data_surface_react.served_paths:
    class: Drupal\data_surface_react\ServedPaths
    arguments: ['@data_surface.resource_registry', '@string_translation']
  # Gates the page and the API by the operation they name: its permission,
  # then the resource's access class.
  data_surface_react.access:
    class: Drupal\data_surface_react\Access\ServedOperationAccessCheck
    arguments: ['@data_surface_react.served_operations', '@data_surface_react.served_paths', '@request_stack', '@logger.channel.data_surface']
    tags:
      - { name: access_check, applies_to: _data_surface_react_access }
  # Answers every HTTP error of the API as problem details.
  data_surface_react.problem_details:
    class: Drupal\data_surface_react\EventSubscriber\ProblemDetailsSubscriber
    tags:
      - { name: event_subscriber }
  # Tags the full schema by its bytes, and answers 304 to a tag that holds.
  data_surface_react.schema_tag:
    class: Drupal\data_surface_react\EventSubscriber\SchemaTagSubscriber
    tags:
      - { name: event_subscriber }
  # The HTTP path and the React page an operation reaches, for the site
  # catalog.
  data_surface_react.catalog_doors:
    class: Drupal\data_surface_react\ServedDoors
    arguments: ['@data_surface_react.served_paths']
    tags:
      - { name: data_surface.catalog_doors, priority: 30 }
