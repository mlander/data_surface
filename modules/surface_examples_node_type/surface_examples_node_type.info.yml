name: 'Surface API examples: content types'
type: module
description: 'A resource-driven alternative to the content type add/edit form: one resource for both operations, locked machine name on edit, service-backed uniqueness on add, and a composite storage writing the node type entity plus its base field overrides. It applies the pattern to core''s content types to test it, and is not part of the project in this form.'
package: 'Surface API examples'
lifecycle: experimental
lifecycle_link: 'https://git.drupalcode.org/project/surface/-/blob/1.0.x/README.md#the-examples'
core_version_requirement: ^11.3 || ^12
dependencies:
  - surface:surface
  - drupal:node
