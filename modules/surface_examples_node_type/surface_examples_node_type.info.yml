name: Surface API Demo - Node type
type: module
description: 'A resource-driven alternative to the content type add/edit form: one resource for both operations, locked machine name on edit, service-backed uniqueness on add, and a composite storage writing the node type entity plus its base field overrides.'
package: Surface API
lifecycle: experimental
lifecycle_link: 'https://git.drupalcode.org/project/surface/-/blob/1.0.x/README.md#experimental-submodules'
core_version_requirement: ^11.3 || ^12
dependencies:
  - surface:surface
  - drupal:node
