# The OpenAPI document of the API surface_react serves, as JSON and as
# YAML, and Swagger UI and Redoc over it. The document is open to every
# account: it is built for no account, from what
# the code and the site's structure declare, and is the same for everyone;
# what an account may do is the per-request contract's and schema's to say.
# Decision: see docs/decisions.md#an-openapi-document-is-one-more-door.

surface_openapi.json:
  path: '/surface-api/openapi.json'
  defaults:
    _controller: '\Drupal\surface_openapi\Controller\OpenApiController::json'
  methods: [GET]
  requirements:
    # Open: built for no account, the same for everyone; the operations'
    # own endpoints still answer by their permissions.
    _access: 'TRUE'

surface_openapi.yaml:
  path: '/surface-api/openapi.yaml'
  defaults:
    _controller: '\Drupal\surface_openapi\Controller\OpenApiController::yaml'
  methods: [GET]
  requirements:
    # Open: built for no account, the same for everyone; the operations'
    # own endpoints still answer by their permissions.
    _access: 'TRUE'

# Swagger UI and Redoc over the document. Under a permission of their own,
# not open: each page runs a CDN's script on the site's origin, so a site
# grants them to the roles it chooses. The document itself stays open.
surface_openapi.docs:
  path: '/surface-api/docs'
  defaults:
    _controller: '\Drupal\surface_openapi\Controller\OpenApiController::docs'
    _title: 'API: try it out'
  methods: [GET]
  requirements:
    _permission: 'access surface api docs'

surface_openapi.reference:
  path: '/surface-api/redoc'
  defaults:
    _controller: '\Drupal\surface_openapi\Controller\OpenApiController::reference'
    _title: 'API reference'
  methods: [GET]
  requirements:
    _permission: 'access surface api docs'
