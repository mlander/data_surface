# Swagger UI and Redoc, from a CDN, each version pinned and each file held
# to its Subresource Integrity hash: cdnjs publishes Swagger UI's, and
# jsDelivr's package listing gives Redoc's (sha256).
# Decision: see docs/decisions.md#contract-3-the-operation-is-the-method.

swagger-ui:
  remote: https://github.com/swagger-api/swagger-ui
  version: 5.29.1
  license:
    name: Apache-2.0
    url: https://github.com/swagger-api/swagger-ui/blob/v5.29.1/LICENSE
    gpl-compatible: true
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.29.1/swagger-ui.min.css:
        type: external
        minified: true
        attributes:
          integrity: sha512-QIJpSy6rqOKoEjIR+Pp7r5lTkNPJPJCRejWzG4jb12bCT1EeL/vcjZtk4NNKeEuVRXY+d34d/t9y1CHzZbgeJQ==
          crossorigin: anonymous
  js:
    https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.29.1/swagger-ui-bundle.min.js:
      type: external
      minified: true
      attributes:
        integrity: sha512-yfAKqi7F3JSDZA7V/XTql3caj2o8A81yg2EWIBykt2BJjLjNYnsd4CVAKvrFp/nYl9HQX7R06Z6e5KBn5aoj6g==
        crossorigin: anonymous

redoc:
  remote: https://github.com/Redocly/redoc
  version: 2.5.1
  license:
    name: MIT
    url: https://github.com/Redocly/redoc/blob/v2.5.1/LICENSE
    gpl-compatible: true
  js:
    https://cdn.jsdelivr.net/npm/redoc@2.5.1/bundles/redoc.standalone.js:
      type: external
      minified: true
      attributes:
        integrity: sha256-LY0T6UtaIQEcxvgmDYfKR10Pby+u0W3RLnOU36O7Bbg=
        crossorigin: anonymous

docs:
  js:
    js/docs.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - surface_openapi/swagger-ui

reference:
  js:
    js/reference.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - surface_openapi/redoc
