name: Surface API - OpenAPI
type: module
description: 'Serves an OpenAPI 3.1 document of every resource operation the React submodule serves over HTTP: its paths and methods, their bodies and answers, and each operation''s full schema as components; with Swagger UI and Redoc over it.'
package: Surface API
lifecycle: experimental
lifecycle_link: 'https://git.drupalcode.org/project/surface/-/blob/1.0.x/README.md#experimental-submodules'
core_version_requirement: ^11.3 || ^12
dependencies:
  - surface:surface
  - surface:surface_react
