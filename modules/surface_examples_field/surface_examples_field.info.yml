name: 'Surface API examples: field settings'
type: module
description: 'Describes core''s field storage and field instance settings as resources, each field type''s settings a variant read from its settings class or its config schema. It applies the pattern to core''s field settings to test it, and is not part of the project in this form.'
package: 'Surface API examples'
lifecycle: experimental
lifecycle_link: 'https://git.drupalcode.org/project/surface/-/blob/1.0.x/README.md#the-examples'
core_version_requirement: ^11.3 || ^12
dependencies:
  - surface:surface
  - drupal:field
