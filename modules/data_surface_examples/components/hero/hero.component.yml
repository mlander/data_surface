$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero
status: stable
description: 'A title across the top of a page, over a darkened picture. Example 12 reads its props into a structure.'
props:
  type: object
  required:
    - title
  properties:
    title:
      type: string
      title: Title
    subtitle:
      type: ['string', 'null']
      title: Subtitle
    align:
      type: string
      title: Alignment
      enum:
        - start
        - center
      meta:enum:
        start: Start
        center: Center
      default: center
    overlay:
      type: integer
      title: Overlay opacity
      description: 'How dark the picture is under the title, in percent.'
      minimum: 0
      maximum: 100
      default: 40
    full_width:
      type: boolean
      title: Full width
      default: false
