# The examples: one resource that grows, one idea per example.
#
# Examples 1 to 3 are each one operation of that example's resource, served by
# the generic operation form: none of them names a form class of this
# module. The panel beside each form is the contract the resource emits,
# rebuilt with the form whenever an answer narrows another key, and below
# it what config schema alone can say about the same settings today.
#
# Examples 1 and 2 also have a classic twin each, the same settings written
# as a ConfigFormBase by hand, writing the same config object; its page is a
# controller only to put what config schema says under the form without
# adding a line to it. Examples 4 and 5 change no resource, so their pages
# say what to do and where to look.
#
# Examples 7 to 12 leave the registration behind: each is one small resource
# of its own for one or two later concepts, served the same way, with a
# third panel saying what the page shows and where the docs explain it.

data_surface_examples.index:
  path: '/surface-examples'
  defaults:
    _controller: '\Drupal\data_surface_examples\Controller\ExamplesController::index'
    _title: 'Surface examples'
  requirements:
    _permission: 'administer site configuration'

data_surface_examples.reset:
  path: '/surface-examples/reset'
  defaults:
    _form: 'Drupal\data_surface_examples\Form\ResetExamplesForm'
    _title: 'Reset the examples'
  requirements:
    _permission: 'administer site configuration'

data_surface_examples.step1:
  path: '/surface-examples/1'
  defaults:
    _form: 'Drupal\data_surface\Form\DataSurfaceOperationForm'
    _title: 'Example 1: declare what you accept'
    _data_surface_resource: 'Drupal\data_surface_examples\Resource\RegistrationStep1Resource'
    _data_surface_operation: 'configure'
    _data_surface_panel: 'data_surface_examples.panels'
  requirements:
    _data_surface_operation_access: 'TRUE'

