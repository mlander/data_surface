services:
  # What a client could be told about an example's settings with no
  # resource: core's own JSON Schema answer for the config object, and a
  # plain mapping of its config schema.
  data_surface_examples.config_schema_contract:
    class: Drupal\data_surface_examples\ConfigSchemaContract
    arguments: ['@config.typed', '@serializer']
  # Shows both, collapsed, and compares the second with a resource's
  # contract when it is handed one.
  data_surface_examples.config_schema_panel:
    class: Drupal\data_surface_examples\ConfigSchemaPanel
    arguments: ['@data_surface_examples.config_schema_contract', '@string_translation']
  # The panel the examples' routes name in _data_surface_panel: the
  # contract panel, and below it what config schema says today.
  data_surface_examples.panels:
    class: Drupal\data_surface_examples\ExamplePanels
    arguments: ['@data_surface_tool.contract_panel', '@data_surface_examples.config_schema_panel', '@data_surface.contract_emitter', '@data_surface.resource_registry', '@data_surface.resources', '@data_surface_examples.concept_panel', '@data_surface_examples.files_panel']
  # The files each example is made of, from Series, on each of its pages.
  data_surface_examples.files_panel:
    class: Drupal\data_surface_examples\FilesPanel
    arguments: ['@string_translation']
  # What examples 7 to 12 and 14 each show, the part of their documents it is
  # about, and their tool calls, each a dry run; a call another module's
  # part needs only where that module is on, in the State it needs.
  data_surface_examples.concept_panel:
    class: Drupal\data_surface_examples\ConceptPanel
    arguments: ['@data_surface.contract_emitter', '@data_surface.resource_registry', '@data_surface.resources', '@plugin.manager.tool', '@account_switcher', '@class_resolver', '@string_translation', '@module_handler', '@state', '@plugin.manager.sdc', '@data_surface.schema_reader', '@data_surface.references', '@data_surface_tool.operation_inputs', '@data_surface.site_list_budget', '@entity_type.manager']
  # Example 15: what its three forms say once they wrote, and where they
  # go back to.
  data_surface_examples.venue_form_cosmetics:
    class: Drupal\data_surface_examples\Form\VenueFormCosmetics
    arguments: ['@string_translation']
  # The rooms an event may be held in, those of example 15's venues,
  # which example 2's room is chosen from.
  data_surface_examples.venue_choices:
    class: Drupal\data_surface_examples\VenueChoices
    arguments: ['@entity_type.manager']
