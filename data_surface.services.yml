services:
  data_surface.factory:
    class: Drupal\data_surface\DataSurfaceFactory
    arguments: ['@event_dispatcher']
  Drupal\data_surface\DataSurfaceFactoryInterface: '@data_surface.factory'
  data_surface.awareness:
    class: Drupal\data_surface\DataSurfaceAwareness
  data_surface.pipeline:
    class: Drupal\data_surface\Pipeline\DataSurfacePipeline
    arguments: ['@typed_data_manager', '@data_surface.options', '@string_translation']
  Drupal\data_surface\Pipeline\DataSurfacePipelineInterface: '@data_surface.pipeline'
  plugin.manager.data_surface_widget:
    class: Drupal\data_surface\Widget\DataSurfaceWidgetManager
    parent: default_plugin_manager
  plugin.manager.data_surface_options_resolver:
    class: Drupal\data_surface\Options\DataSurfaceOptionsResolverManager
    parent: default_plugin_manager
  data_surface.options:
    class: Drupal\data_surface\Options\DataSurfaceOptions
    arguments: ['@plugin.manager.data_surface_options_resolver', '@validation.constraint', '@logger.channel.data_surface']
  data_surface.secret_codec:
    class: Drupal\data_surface\Target\SodiumSecretCodec
  Drupal\data_surface\Target\SecretCodecInterface: '@data_surface.secret_codec'
  data_surface.form_builder:
    class: Drupal\data_surface\Form\DataSurfaceFormBuilder
    arguments: ['@plugin.manager.data_surface_widget', '@data_surface.pipeline', '@element_info', '@messenger', '@data_surface.options']
  Drupal\data_surface\Form\DataSurfaceFormBuilderInterface: '@data_surface.form_builder'
  logger.channel.data_surface:
    parent: logger.channel_base
    arguments: ['data_surface']
  # The new spelling: surfaces discovered in src/Surface and src/SurfaceAlter
  # by SurfaceCollectorPass, and the build step that seals them through the
  # factory above.
  data_surface.surface_registry:
    class: Drupal\data_surface\SurfaceBuild\SurfaceRegistry
    arguments: ['%data_surface.surface_classes%', '@cache.discovery']
  data_surface.surfaces:
    class: Drupal\data_surface\SurfaceBuild\Surfaces
    arguments: ['@data_surface.surface_registry', '@data_surface.factory', '@typed_data_manager', '@class_resolver', '@current_user', '@data_surface.situation_arguments']
  Drupal\data_surface\SurfaceBuild\SurfacesInterface: '@data_surface.surfaces'
  # A situation's arguments from a route's parameters or a tool's inputs,
  # by name; an entity's id becomes the entity a parameter is typed with.
  data_surface.situation_arguments:
    class: Drupal\data_surface\SurfaceBuild\SituationArguments
    arguments: ['@entity_type.manager']
  # The route access check for a route served by a situation: the
  # situation's permission, then the surface's access class.
  data_surface.situation_access:
    class: Drupal\data_surface\Access\SituationAccessCheck
    arguments: ['@data_surface.surfaces', '@data_surface.surface_registry', '@data_surface.situation_arguments']
    tags:
      - { name: access_check, applies_to: _data_surface_situation_access }
  # Every discovered surface, its situations, alters and variants, as one
  # array: what docs/catalogue.md is generated from.
  data_surface.surface_catalogue:
    class: Drupal\data_surface\SurfaceBuild\SurfaceCatalogue
    arguments: ['@data_surface.surface_registry', '@data_surface.surfaces', '@data_surface.surface_plugins']
  # Which plugins name which surface with #[UsesSurface], read from the
  # definitions of every host that reads the attribute (the keys of
  # SurfacePluginHooks::HOSTS).
  data_surface.surface_plugins:
    class: Drupal\data_surface\SurfaceBuild\SurfacePlugins
    arguments:
      - block: '@plugin.manager.block'
        field_formatter: '@plugin.manager.field.formatter'
        condition: '@plugin.manager.condition'
        action: '@plugin.manager.action'
        field_type: '@plugin.manager.field.field_type'
