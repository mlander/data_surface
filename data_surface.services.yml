services:
  data_surface.factory:
    class: Drupal\data_surface\DataSurfaceFactory
    arguments: ['@event_dispatcher']
  Drupal\data_surface\DataSurfaceFactoryInterface: '@data_surface.factory'
  data_surface.awareness:
    class: Drupal\data_surface\DataSurfaceAwareness
  data_surface.pipeline:
    class: Drupal\data_surface\Pipeline\DataSurfacePipeline
    arguments: ['@typed_data_manager', '@data_surface.options', '@string_translation']
  Drupal\data_surface\Pipeline\DataSurfacePipelineInterface: '@data_surface.pipeline'
  plugin.manager.data_surface_widget:
    class: Drupal\data_surface\Widget\DataSurfaceWidgetManager
    parent: default_plugin_manager
  plugin.manager.data_surface_options_resolver:
    class: Drupal\data_surface\Options\DataSurfaceOptionsResolverManager
    parent: default_plugin_manager
  data_surface.options:
    class: Drupal\data_surface\Options\DataSurfaceOptions
    arguments: ['@plugin.manager.data_surface_options_resolver', '@validation.constraint', '@logger.channel.data_surface']
  data_surface.secret_codec:
    class: Drupal\data_surface\Target\SodiumSecretCodec
  Drupal\data_surface\Target\SecretCodecInterface: '@data_surface.secret_codec'
  data_surface.form_builder:
    class: Drupal\data_surface\Form\DataSurfaceFormBuilder
    arguments: ['@plugin.manager.data_surface_widget', '@data_surface.pipeline', '@element_info', '@messenger', '@data_surface.options']
  Drupal\data_surface\Form\DataSurfaceFormBuilderInterface: '@data_surface.form_builder'
  logger.channel.data_surface:
    parent: logger.channel_base
    arguments: ['data_surface']
