# Loaded before Prism's core, which reads Prism.manual as it loads, so
# Prism highlights only when highlight.js asks.
prism_manual:
  js:
    js/prism-manual.js: {}

# What the surface_code element attaches: highlights each block once,
# over AJAX too.
highlight:
  js:
    js/highlight.js: {}
  dependencies:
    - core/drupal
    - core/once
    - surface/prism

# Sets the contract panel beside the form's elements on a wide screen,
# below them on a narrow one.
contract_panel:
  css:
    component:
      css/contract-panel.css: {}

